<div class="container mt-4">

  <!-- Loading -->
  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <div *ngIf="!loading">

    <div class="d-flex justify-content-between align-items-center mb-3">

  <h3>Electricity Bills</h3>

  <div>

    <button
      class="btn btn-danger me-2"
      (click)="exportPDF()">

      <i class="fa-solid fa-file-pdf"></i>

      PDF

    </button>

    <button
      class="btn btn-success me-2"
      (click)="exportExcel()">

      <i class="fa-solid fa-file-excel"></i>

      Excel

    </button>

    <button
      class="btn btn-primary"
      (click)="generateBill()">

      Generate Bill

    </button>

  </div>

</div>

    <div class="row mb-3">

      <div class="col-md-6">

        <mat-form-field appearance="outline" class="w-100">

          <mat-label>Search Bill</mat-label>

          <input
            matInput
            placeholder="Bill No / Consumer / Meter"
            (keyup)="applyFilter($event)">

        </mat-form-field>

      </div>

      <div class="col-md-3">

        <mat-form-field appearance="outline" class="w-100">

          <mat-label>Status</mat-label>

          <mat-select
            [(ngModel)]="selectedStatus"
            (selectionChange)="filterStatus()">

            <mat-option value="">All</mat-option>
            <mat-option value="PAID">PAID</mat-option>
            <mat-option value="UNPAID">UNPAID</mat-option>
            <mat-option value="OVERDUE">OVERDUE</mat-option>

          </mat-select>

        </mat-form-field>

      </div>

    </div>

    <!-- TABLE -->

    <div
      *ngIf="dataSource.data.length > 0"
      class="table-responsive">

      <table
        mat-table
        [dataSource]="dataSource"
        matSort
        class="mat-elevation-z8 w-100">

        <ng-container matColumnDef="billNumber">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Bill No
          </th>

          <td mat-cell *matCellDef="let bill">
            {{ bill.billNumber }}
          </td>

        </ng-container>

        <ng-container matColumnDef="consumerName">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Consumer
          </th>

          <td mat-cell *matCellDef="let bill">
            {{ bill.consumerName }}
          </td>

        </ng-container>

        <ng-container matColumnDef="meterNumber">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Meter
          </th>

          <td mat-cell *matCellDef="let bill">
            {{ bill.meterNumber }}
          </td>

        </ng-container>

        <ng-container matColumnDef="totalAmount">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Total Amount
          </th>

          <td mat-cell *matCellDef="let bill">
            ₹ {{ bill.totalAmount }}
          </td>

        </ng-container>

        <ng-container matColumnDef="billDate">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Bill Date
          </th>

          <td mat-cell *matCellDef="let bill">
            {{ bill.billDate }}
          </td>

        </ng-container>

        <ng-container matColumnDef="dueDate">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Due Date
          </th>

          <td mat-cell *matCellDef="let bill">
            {{ bill.dueDate }}
          </td>

        </ng-container>

        <ng-container matColumnDef="status">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Status
          </th>

          <td mat-cell *matCellDef="let bill">

            <span
              class="badge"
              [ngClass]="{
                'bg-success': bill.status === 'PAID',
                'bg-warning text-dark': bill.status === 'UNPAID',
                'bg-danger': bill.status === 'OVERDUE'
              }">

              {{ bill.status }}

            </span>

          </td>

        </ng-container>

        <ng-container matColumnDef="action">

          <th mat-header-cell *matHeaderCellDef>
            Action
          </th>

          <td mat-cell *matCellDef="let bill">

            <button
              class="btn btn-info btn-sm me-2"
              (click)="viewBill(bill.id!)">

              View

            </button>

            <button
              class="btn btn-success btn-sm me-2"
              (click)="downloadBill(bill.id!)">

              PDF

            </button>

            <button
              class="btn btn-danger btn-sm"
              (click)="deleteBill(bill.id!)">

              Delete

            </button>

          </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>

    </div>

    <!-- EMPTY STATE -->

    <app-empty-state
      *ngIf="dataSource.data.length === 0"
      icon="fa-solid fa-file-invoice-dollar"
      title="No Bills Found"
      message="There are no electricity bills available."
      buttonText="Generate Bill"
      buttonLink="/bills/generate">

    </app-empty-state>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5,10,20,50]"
      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
