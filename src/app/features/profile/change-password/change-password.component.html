<div class="container-fluid mt-4">

    <div class="row justify-content-center">

        <div class="col-lg-6 col-md-8">

            <div class="card shadow password-card">

                <div class="card-header bg-primary text-white">

                    <h4 class="mb-0">

                        <i class="fa-solid fa-key me-2"></i>

                        Change Password

                    </h4>

                </div>

                <div class="card-body">

                    <form
                        [formGroup]="passwordForm"
                        (ngSubmit)="changePassword()">

                        <!-- Current Password -->

                        <div class="mb-3">

                            <label class="form-label">

                                Current Password
                                <span class="text-danger">*</span>

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa-solid fa-lock"></i>

                                </span>

                                <input
                                    [type]="hideCurrent ? 'password' : 'text'"
                                    class="form-control"
                                    formControlName="currentPassword">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    (click)="hideCurrent=!hideCurrent">

                                    <i
                                        class="fa-solid"
                                        [ngClass]="hideCurrent ? 'fa-eye' : 'fa-eye-slash'">
                                    </i>

                                </button>

                            </div>

                            <small
                                class="text-danger"
                                *ngIf="passwordForm.get('currentPassword')?.touched &&
                                       passwordForm.get('currentPassword')?.invalid">

                                Current Password is required.

                            </small>

                        </div>

                        <!-- New Password -->

                        <div class="mb-3">

                            <label class="form-label">

                                New Password
                                <span class="text-danger">*</span>

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa-solid fa-key"></i>

                                </span>

                                <input
                                    [type]="hideNew ? 'password' : 'text'"
                                    class="form-control"
                                    formControlName="newPassword">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    (click)="hideNew=!hideNew">

                                    <i
                                        class="fa-solid"
                                        [ngClass]="hideNew ? 'fa-eye' : 'fa-eye-slash'">
                                    </i>

                                </button>

                            </div>

                            <small
                                class="text-danger"
                                *ngIf="passwordForm.get('newPassword')?.touched &&
                                       passwordForm.get('newPassword')?.hasError('required')">

                                New Password is required.

                            </small>

                            <small
                                class="text-danger"
                                *ngIf="passwordForm.get('newPassword')?.touched &&
                                       passwordForm.get('newPassword')?.hasError('minlength')">

                                Minimum 6 characters required.

                            </small>

                        </div>

                        <!-- Confirm Password -->

                        <div class="mb-4">

                            <label class="form-label">

                                Confirm Password
                                <span class="text-danger">*</span>

                            </label>

                            <div class="input-group">

                                <span class="input-group-text">

                                    <i class="fa-solid fa-check"></i>

                                </span>

                                <input
                                    [type]="hideConfirm ? 'password' : 'text'"
                                    class="form-control"
                                    formControlName="confirmPassword">

                                <button
                                    type="button"
                                    class="btn btn-outline-secondary"
                                    (click)="hideConfirm=!hideConfirm">

                                    <i
                                        class="fa-solid"
                                        [ngClass]="hideConfirm ? 'fa-eye' : 'fa-eye-slash'">
                                    </i>

                                </button>

                            </div>

                            <small
                                class="text-danger"
                                *ngIf="passwordForm.get('confirmPassword')?.touched &&
                                       passwordForm.get('confirmPassword')?.invalid">

                                Confirm Password is required.

                            </small>

                        </div>

                        <div class="d-flex justify-content-end">

                            <button
                                type="reset"
                                class="btn btn-secondary me-2">

                                <i class="fa-solid fa-rotate-left me-1"></i>

                                Reset

                            </button>

                            <button
                                type="submit"
                                class="btn btn-success"
                                [disabled]="passwordForm.invalid">

                                <i class="fa-solid fa-floppy-disk me-1"></i>

                                Change Password

                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>
