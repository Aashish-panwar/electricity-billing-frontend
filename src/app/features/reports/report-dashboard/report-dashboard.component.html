<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h2 class="fw-bold mb-1">
                Reports Dashboard
            </h2>

            <p class="text-muted mb-0">
                View and analyze system reports.
            </p>

        </div>

    </div>

    <div class="row g-4">

        <!-- Revenue Report -->

        <div class="col-lg-4 col-md-6">

            <div class="card report-card h-100">

                <div class="card-body text-center">

                    <div class="report-icon bg-primary">

                        <i class="fa-solid fa-chart-line"></i>

                    </div>

                    <h5 class="mt-3 fw-semibold">

                        Revenue Report

                    </h5>

                    <p class="text-muted">

                        View total revenue, collections and financial statistics.

                    </p>

                    <button
                        class="btn btn-primary px-4"
                        routerLink="/reports/revenue">

                        <i class="fa-solid fa-arrow-right me-2"></i>

                        Open

                    </button>

                </div>

            </div>

        </div>

        <!-- Consumer Report -->

        <div class="col-lg-4 col-md-6">

            <div class="card report-card h-100">

                <div class="card-body text-center">

                    <div class="report-icon bg-success">

                        <i class="fa-solid fa-users"></i>

                    </div>

                    <h5 class="mt-3 fw-semibold">

                        Consumer Report

                    </h5>

                    <p class="text-muted">

                        View consumer details, registrations and activity.

                    </p>

                    <button
                        class="btn btn-success px-4"
                        routerLink="/reports/consumer">

                        <i class="fa-solid fa-arrow-right me-2"></i>

                        Open

                    </button>

                </div>

            </div>

        </div>

        <!-- Monthly Report -->

        <div class="col-lg-4 col-md-6">

            <div class="card report-card h-100">

                <div class="card-body text-center">

                    <div class="report-icon bg-warning">

                        <i class="fa-solid fa-calendar-days"></i>

                    </div>

                    <h5 class="mt-3 fw-semibold">

                        Monthly Report

                    </h5>

                    <p class="text-muted">

                        Monthly billing, payments and consumption overview.

                    </p>

                    <button
                        class="btn btn-warning text-white px-4"
                        routerLink="/reports/monthly">

                        <i class="fa-solid fa-arrow-right me-2"></i>

                        Open

                    </button>

                </div>

            </div>

        </div>

    </div>

</div>
