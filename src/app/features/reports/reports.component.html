<div class="container mt-4">

    <div class="text-center mb-5">

        <h2 class="fw-bold">

            Reports Dashboard

        </h2>

        <p class="text-muted">

            View analytical reports and system statistics.

        </p>

    </div>

    <div class="row g-4">

        <div class="col-lg-4 col-md-6">

            <div class="card report-card shadow">

                <div class="card-body text-center">

                    <i class="fa-solid fa-chart-line report-icon text-primary"></i>

                    <h4 class="mt-3">

                        Revenue Report

                    </h4>

                    <p class="text-muted">

                        View revenue, bills, payments and pending amount.

                    </p>

                    <a
                        routerLink="/reports/revenue"
                        class="btn btn-primary">

                        Open Report

                    </a>

                </div>

            </div>

        </div>

        <div class="col-lg-4 col-md-6">

            <div class="card report-card shadow">

                <div class="card-body text-center">

                    <i class="fa-solid fa-users report-icon text-success"></i>

                    <h4 class="mt-3">

                        Consumer Report

                    </h4>

                    <p class="text-muted">

                        View consumer usage and billing summary.

                    </p>

                    <a
                        routerLink="/reports/consumer"
                        class="btn btn-success">

                        Open Report

                    </a>

                </div>

            </div>

        </div>

        <div class="col-lg-4 col-md-6">

            <div class="card report-card shadow">

                <div class="card-body text-center">

                    <i class="fa-solid fa-calendar-days report-icon text-warning"></i>

                    <h4 class="mt-3">

                        Monthly Report

                    </h4>

                    <p class="text-muted">

                        View monthly billing and revenue statistics.

                    </p>

                    <a
                        routerLink="/reports/monthly"
                        class="btn btn-warning text-white">

                        Open Report

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>
