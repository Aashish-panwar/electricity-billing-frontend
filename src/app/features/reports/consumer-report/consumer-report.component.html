<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

    <div>

        <h2 class="fw-bold mb-1">

            Consumer Report

        </h2>

        <p class="text-muted">

            Consumer billing and electricity usage summary.

        </p>

    </div>

    <div>

        <button
            class="btn btn-danger me-2"
            (click)="exportPDF()">

            <i class="fa-solid fa-file-pdf me-2"></i>

            PDF

        </button>

        <button
            class="btn btn-success"
            (click)="exportExcel()">

            <i class="fa-solid fa-file-excel me-2"></i>

            Excel

        </button>

    </div>

</div>

    <div class="card shadow">

        <div class="card-body">

            <div class="row mb-3">

                <div class="col-md-4">

                    <input
                        type="text"
                        class="form-control"
                        placeholder="Search Consumer..."
                        [(ngModel)]="searchText"
                        (input)="applyFilter()">

                </div>

            </div>

            <div class="table-responsive">

                <table class="table table-hover align-middle">

                    <thead>

                        <tr>

                            <th>Consumer No</th>

                            <th>Name</th>

                            <th>Meter</th>

                            <th>Total Units</th>

                            <th>Total Bill</th>

                            <th>Status</th>

                        </tr>

                    </thead>

                    <tbody>

                        <tr *ngIf="filteredConsumers.length===0">

                            <td
                                colspan="6"
                                class="text-center py-5">

                                <i class="fa-solid fa-file-circle-xmark fa-3x text-secondary mb-3"></i>

                                <h5>No Consumer Records Found</h5>

                            </td>

                        </tr>

                        <tr *ngFor="let consumer of filteredConsumers">

                            <td>

                                {{consumer.consumerNumber}}

                            </td>

                            <td>

                                {{consumer.consumerName}}

                            </td>

                            <td>

                                {{consumer.meterNumber}}

                            </td>

                            <td>

                                {{consumer.totalUnits}}

                            </td>

                            <td>

                                ₹ {{consumer.totalAmount}}

                            </td>

                            <td>

                                <span
                                    class="badge"
                                    [ngClass]="{

                                    'bg-success':consumer.status==='ACTIVE',

                                    'bg-danger':consumer.status==='INACTIVE',

                                    'bg-warning text-dark':consumer.status==='PENDING'

                                    }">

                                    {{consumer.status}}

                                </span>

                            </td>

                        </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>
