<div class="container-fluid">

  <!-- Loading -->
  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <div *ngIf="!loading">

    <div class="page-header">

      <div>

        <h2 class="page-title">
          <i class="fa-solid fa-bolt text-warning me-2"></i>
          Tariff Management
        </h2>

        <p class="page-subtitle">
          Manage electricity tariff plans.
        </p>

      </div>

      <button
        class="btn btn-primary"
        (click)="addTariff()">

        <i class="fa-solid fa-plus me-2"></i>

        Add Tariff

      </button>

    </div>

    <mat-form-field appearance="outline" class="w-100 mb-4">

      <mat-label>Search Tariff</mat-label>

      <input
        matInput
        placeholder="Search by Tariff Name"
        (keyup)="applyFilter($event)">

    </mat-form-field>

    <!-- TABLE -->

    <div
      *ngIf="dataSource.data.length > 0"
      class="table-responsive custom-table">

      <table
        mat-table
        [dataSource]="dataSource"
        matSort
        class="w-100">

        <!-- ID -->
        <ng-container matColumnDef="id">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            ID
          </th>

          <td mat-cell *matCellDef="let row">
            {{ row.id }}
          </td>

        </ng-container>

        <!-- Tariff -->
        <ng-container matColumnDef="tariffName">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Tariff Name
          </th>

          <td mat-cell *matCellDef="let row">
            {{ row.tariffName }}
          </td>

        </ng-container>

        <!-- Rate -->
        <ng-container matColumnDef="ratePerUnit">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Rate / Unit
          </th>

          <td mat-cell *matCellDef="let row">
            ₹ {{ row.ratePerUnit }}
          </td>

        </ng-container>

        <!-- Fixed -->
        <ng-container matColumnDef="fixedCharge">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Fixed Charge
          </th>

          <td mat-cell *matCellDef="let row">
            ₹ {{ row.fixedCharge }}
          </td>

        </ng-container>

        <!-- Effective -->
        <ng-container matColumnDef="effectiveFrom">

          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Effective From
          </th>

          <td mat-cell *matCellDef="let row">
            {{ row.effectiveFrom }}
          </td>

        </ng-container>

        <!-- Action -->
        <ng-container matColumnDef="action">

          <th mat-header-cell *matHeaderCellDef>
            Actions
          </th>

          <td mat-cell *matCellDef="let row">

            <button
              class="btn btn-info btn-sm me-2"
              (click)="viewTariff(row.id!)">

              <i class="fa-solid fa-eye"></i>

            </button>

            <button
              class="btn btn-warning btn-sm me-2"
              (click)="editTariff(row.id!)">

              <i class="fa-solid fa-pen"></i>

            </button>

            <button
              class="btn btn-danger btn-sm"
              (click)="deleteTariff(row.id!)">

              <i class="fa-solid fa-trash"></i>

            </button>

          </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      </table>

    </div>

    <!-- EMPTY STATE -->

    <app-empty-state
      *ngIf="dataSource.data.length === 0"
      icon="fa-solid fa-bolt"
      title="No Tariffs Found"
      message="There are no tariff plans available."
      buttonText="Add Tariff"
      buttonLink="/tariffs/add">

    </app-empty-state>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5,10,20,50]"
      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
