<div class="container-fluid">

  <div class="card shadow-lg border-0">

    <div class="card-header bg-primary text-white">

      <h4 class="mb-0">
        <i class="fa-solid fa-gauge-high me-2"></i>
        Add Meter
      </h4>

    </div>

    <div class="card-body">

      <form
        [formGroup]="meterForm"
        (ngSubmit)="saveMeter()">

        <div class="row">

          <!-- Meter Number -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Meter Number <span class="text-danger">*</span>
            </label>

            <input
              class="form-control"
              formControlName="meterNumber">

            <small
              class="text-danger"
              *ngIf="meterForm.get('meterNumber')?.touched &&
                     meterForm.get('meterNumber')?.invalid">

              Meter Number is required.

            </small>

          </div>

          <!-- Manufacturer -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Manufacturer <span class="text-danger">*</span>
            </label>

            <input
              class="form-control"
              formControlName="manufacturer">

            <small
              class="text-danger"
              *ngIf="meterForm.get('manufacturer')?.touched &&
                     meterForm.get('manufacturer')?.invalid">

              Manufacturer is required.

            </small>

          </div>

          <!-- Model -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Model <span class="text-danger">*</span>
            </label>

            <input
              class="form-control"
              formControlName="model">

            <small
              class="text-danger"
              *ngIf="meterForm.get('model')?.touched &&
                     meterForm.get('model')?.invalid">

              Model is required.

            </small>

          </div>

          <!-- Installation Year -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Installation Year <span class="text-danger">*</span>
            </label>

            <input
              type="number"
              class="form-control"
              formControlName="installationYear">

          </div>

          <!-- Status -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Status <span class="text-danger">*</span>
            </label>

            <select
              class="form-select"
              formControlName="status">

              <option value="ACTIVE">ACTIVE</option>
              <option value="INACTIVE">INACTIVE</option>

            </select>

          </div>

          <!-- Current Reading -->

          <div class="col-md-6 mb-3">

            <label class="form-label">
              Current Reading <span class="text-danger">*</span>
            </label>

            <input
              type="number"
              class="form-control"
              formControlName="currentReading">

          </div>

          <!-- Consumer -->

          <div class="col-md-12 mb-4">

            <label class="form-label">
              Select Consumer <span class="text-danger">*</span>
            </label>

            <select
              class="form-select"
              formControlName="consumerId">

              <option [ngValue]="null">
                Select Consumer
              </option>

              <option
                *ngFor="let consumer of consumers"
                [ngValue]="consumer.id">

                {{consumer.fullName}} - {{consumer.consumerNumber}}

              </option>

            </select>

            <small
              class="text-danger"
              *ngIf="meterForm.get('consumerId')?.touched &&
                     meterForm.get('consumerId')?.invalid">

              Consumer is required.

            </small>

          </div>

        </div>

        <div class="mt-3">

          <button
            class="btn btn-success me-2"
            type="submit"
            [disabled]="loading">

            <span
              *ngIf="loading"
              class="spinner-border spinner-border-sm me-2">
            </span>

            <i
              *ngIf="!loading"
              class="fa-solid fa-floppy-disk me-2">
            </i>

            {{ loading ? 'Saving...' : 'Save Meter' }}

          </button>

          <button
            type="button"
            class="btn btn-secondary"
            routerLink="/meters">

            Cancel

          </button>

        </div>

      </form>

    </div>

  </div>

</div>
