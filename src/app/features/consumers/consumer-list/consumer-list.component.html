<div class="container-fluid">

  <app-loading-spinner *ngIf="loading"></app-loading-spinner>

  <div *ngIf="!loading">

    <div class="d-flex justify-content-between align-items-center mb-4">

      <h2>Consumer Management</h2>

      <button
        class="btn btn-primary"
        routerLink="/consumers/add">

        <i class="fa-solid fa-plus me-2"></i>
        Add Consumer

      </button>

    </div>

    <mat-form-field appearance="outline" class="w-100 mb-3">

      <mat-label>Search Consumer</mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Search by Consumer No, Name, Email, Mobile or City">

    </mat-form-field>

    <div
      *ngIf="dataSource.data.length > 0"
      class="table-responsive">

      <table
        mat-table
        [dataSource]="dataSource"
        matSort
        class="mat-elevation-z8 w-100">

        <!-- Consumer Number -->
        <ng-container matColumnDef="consumerNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Consumer No
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.consumerNumber }}
          </td>
        </ng-container>

        <!-- Name -->
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Name
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.fullName }}
          </td>
        </ng-container>

        <!-- Mobile -->
        <ng-container matColumnDef="mobileNumber">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Mobile
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.mobileNumber }}
          </td>
        </ng-container>

        <!-- Email -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Email
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.email }}
          </td>
        </ng-container>

        <!-- City -->
        <ng-container matColumnDef="city">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            City
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.city }}
          </td>
        </ng-container>

        <!-- Consumer Type -->
        <ng-container matColumnDef="consumerType">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Type
          </th>
          <td mat-cell *matCellDef="let row">
            {{ row.consumerType }}
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="action">

          <th mat-header-cell *matHeaderCellDef>
            Actions
          </th>

          <td mat-cell *matCellDef="let row">

            <button
              class="btn btn-info btn-sm me-2"
              (click)="view(row.id!)">

              <i class="fa-solid fa-eye"></i>

            </button>

            <button
              class="btn btn-warning btn-sm me-2"
              (click)="edit(row.id!)">

              <i class="fa-solid fa-pen"></i>

            </button>

            <button
              class="btn btn-danger btn-sm"
              (click)="delete(row.id!)">

              <i class="fa-solid fa-trash"></i>

            </button>

          </td>

        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      </table>

    </div>

    <app-empty-state
      *ngIf="dataSource.data.length === 0"
      icon="fa-solid fa-users"
      title="No Consumers Found"
      message="There are no consumers available."
      buttonText="Add Consumer"
      buttonLink="/consumers/add">
    </app-empty-state>

    <mat-paginator
      [pageSize]="10"
      [pageSizeOptions]="[5,10,20,50]"
      showFirstLastButtons>
    </mat-paginator>

  </div>

</div>
