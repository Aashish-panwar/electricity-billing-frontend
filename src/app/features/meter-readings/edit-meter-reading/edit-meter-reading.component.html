<div class="container-fluid py-4">

  <div class="row justify-content-center">

    <div class="col-lg-8">

      <div class="card shadow-lg border-0">

        <div class="card-header bg-warning text-dark py-3">

          <h4 class="mb-0">
            <i class="fa-solid fa-pen-to-square me-2"></i>
            Edit Meter Reading
          </h4>

        </div>

        <div class="card-body p-4">

          <form
            [formGroup]="readingForm"
            (ngSubmit)="updateReading()">

            <div class="row">

              <!-- Meter -->

              <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                  Meter
                  <span class="text-danger">*</span>
                </label>

                <select
                  class="form-select"
                  formControlName="meterId"
                  [class.is-invalid]="readingForm.get('meterId')?.invalid && readingForm.get('meterId')?.touched">

                  <option value="">
                    Select Meter
                  </option>

                  <option
                    *ngFor="let meter of meters"
                    [value]="meter.id">

                    {{ meter.meterNumber }} - {{ meter.consumerName }}

                  </option>

                </select>

                <div
                  class="invalid-feedback"
                  *ngIf="readingForm.get('meterId')?.touched">

                  Please select a meter.

                </div>

              </div>

              <!-- Current Reading -->

              <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                  Current Reading
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="number"
                  class="form-control"
                  formControlName="currentReading"
                  [class.is-invalid]="readingForm.get('currentReading')?.invalid && readingForm.get('currentReading')?.touched">

                <div
                  class="invalid-feedback"
                  *ngIf="readingForm.get('currentReading')?.touched">

                  Current reading is required.

                </div>

              </div>

              <!-- Billing Month -->

              <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                  Billing Month
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="number"
                  min="1"
                  max="12"
                  class="form-control"
                  formControlName="billingMonth"
                  [class.is-invalid]="readingForm.get('billingMonth')?.invalid && readingForm.get('billingMonth')?.touched">

                <div
                  class="invalid-feedback"
                  *ngIf="readingForm.get('billingMonth')?.touched">

                  Enter a valid month (1-12).

                </div>

              </div>

              <!-- Billing Year -->

              <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                  Billing Year
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="number"
                  class="form-control"
                  formControlName="billingYear"
                  [class.is-invalid]="readingForm.get('billingYear')?.invalid && readingForm.get('billingYear')?.touched">

                <div
                  class="invalid-feedback"
                  *ngIf="readingForm.get('billingYear')?.touched">

                  Billing year is required.

                </div>

              </div>

              <!-- Reading Date -->

              <div class="col-md-6 mb-3">

                <label class="form-label fw-semibold">
                  Reading Date
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="date"
                  class="form-control"
                  formControlName="readingDate"
                  [class.is-invalid]="readingForm.get('readingDate')?.invalid && readingForm.get('readingDate')?.touched">

                <div
                  class="invalid-feedback"
                  *ngIf="readingForm.get('readingDate')?.touched">

                  Reading date is required.

                </div>

              </div>

              <!-- Remarks -->

              <div class="col-md-12 mb-4">

                <label class="form-label fw-semibold">
                  Remarks
                </label>

                <textarea
                  rows="4"
                  class="form-control"
                  formControlName="remarks"
                  placeholder="Enter remarks (optional)">
                </textarea>

              </div>

            </div>

            <div class="d-flex justify-content-end">

              <button
                type="submit"
                class="btn btn-warning me-2"
                [disabled]="readingForm.invalid">

                <i class="fa-solid fa-floppy-disk me-1"></i>
                Update Reading

              </button>

              <button
                type="button"
                class="btn btn-secondary"
                routerLink="/meter-readings">

                <i class="fa-solid fa-arrow-left me-1"></i>
                Cancel

              </button>

            </div>

          </form>

        </div>

      </div>

    </div>

  </div>

</div>
