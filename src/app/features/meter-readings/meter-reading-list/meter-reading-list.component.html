<div class="container-fluid">

  <div class="page-header">

    <div>

      <h2 class="page-title">
        <i class="fa-solid fa-file-lines text-primary me-2"></i>
        Meter Readings
      </h2>

      <p class="page-subtitle">
        Manage electricity meter readings.
      </p>

    </div>

    <button
      class="btn btn-primary"
      (click)="addReading()">

      <i class="fa-solid fa-plus me-2"></i>
      Add Reading

    </button>

  </div>

  <mat-form-field appearance="outline" class="w-100 mb-4">

    <mat-label>Search Meter Reading</mat-label>

    <input
      matInput
      placeholder="Search Meter, Status, Month or Year"
      (keyup)="applyFilter($event)">

  </mat-form-field>

  <div
    class="table-responsive custom-table"
    *ngIf="dataSource.data.length > 0">

    <table
      mat-table
      [dataSource]="dataSource"
      matSort
      class="w-100">

      <ng-container matColumnDef="meterNumber">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Meter</th>
        <td mat-cell *matCellDef="let row">{{ row.meterNumber }}</td>
      </ng-container>

      <ng-container matColumnDef="previousReading">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Previous</th>
        <td mat-cell *matCellDef="let row">{{ row.previousReading }}</td>
      </ng-container>

      <ng-container matColumnDef="currentReading">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Current</th>
        <td mat-cell *matCellDef="let row">{{ row.currentReading }}</td>
      </ng-container>

      <ng-container matColumnDef="unitsConsumed">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Units</th>
        <td mat-cell *matCellDef="let row">{{ row.unitsConsumed }}</td>
      </ng-container>

      <ng-container matColumnDef="billingMonth">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Month</th>
        <td mat-cell *matCellDef="let row">{{ row.billingMonth }}</td>
      </ng-container>

      <ng-container matColumnDef="billingYear">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Year</th>
        <td mat-cell *matCellDef="let row">{{ row.billingYear }}</td>
      </ng-container>

      <ng-container matColumnDef="status">

        <th mat-header-cell *matHeaderCellDef mat-sort-header>
          Status
        </th>

        <td mat-cell *matCellDef="let row">

          <span
            class="badge"
            [ngClass]="{
              'bg-success': row.status==='APPROVED',
              'bg-warning text-dark': row.status==='PENDING',
              'bg-danger': row.status==='REJECTED'
            }">

            {{ row.status }}

          </span>

        </td>

      </ng-container>

      <ng-container matColumnDef="action">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let row">

          <button
            class="btn btn-info btn-sm me-2"
            (click)="viewReading(row.id!)">

            <i class="fa-solid fa-eye"></i>

          </button>

          <button
            class="btn btn-warning btn-sm me-2"
            (click)="editReading(row.id!)">

            <i class="fa-solid fa-pen"></i>

          </button>

          <button
            class="btn btn-success me-2"
            (click)="generateBill(row.id!)">

            Bill

          </button>

          <button
            class="btn btn-danger btn-sm"
            (click)="deleteReading(row.id!)">

            <i class="fa-solid fa-trash"></i>

          </button>

        </td>

      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>

  </div>

  <app-empty-state
    *ngIf="dataSource.data.length === 0"
    icon="fa-solid fa-file-lines"
    title="No Meter Readings Found"
    message="There are no meter readings available."
    buttonText="Add Reading"
    buttonLink="/meter-readings/add">
  </app-empty-state>

  <mat-paginator
    [pageSize]="10"
    [pageSizeOptions]="[5,10,20,50]"
    showFirstLastButtons>
  </mat-paginator>

</div>
