<div class="login-container">

    <div class="login-card shadow-lg">

        <div class="text-center mb-4">

            <div class="logo-circle">

                <i class="fa-solid fa-bolt"></i>

            </div>

            <h2>Electricity Billing System</h2>

            <p>Administrator Login</p>

        </div>

        <form
            [formGroup]="loginForm"
            (ngSubmit)="login()">

            <!-- Email -->

            <div class="mb-3">

                <label class="form-label">

                    Email
                    <span class="text-danger">*</span>

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fa-solid fa-envelope"></i>

                    </span>

                    <input
                        type="email"
                        class="form-control"
                        formControlName="email"
                        placeholder="Enter Email">

                </div>

                <small
                    class="text-danger"
                    *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid">

                    Please enter a valid email.

                </small>

            </div>

            <!-- Password -->

            <div class="mb-4">

                <label class="form-label">

                    Password
                    <span class="text-danger">*</span>

                </label>

                <div class="input-group">

                    <span class="input-group-text">

                        <i class="fa-solid fa-lock"></i>

                    </span>

                    <input
                        [type]="hidePassword ? 'password' : 'text'"
                        class="form-control"
                        formControlName="password"
                        placeholder="Enter Password">

                    <button
                        class="btn btn-outline-secondary"
                        type="button"
                        (click)="hidePassword=!hidePassword">

                        <i
                            class="fa-solid"
                            [ngClass]="hidePassword ? 'fa-eye' : 'fa-eye-slash'">
                        </i>

                    </button>

                </div>

                <small
                    class="text-danger"
                    *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid">

                    Password is required.

                </small>

            </div>

            <button
                type="submit"
                class="btn btn-primary w-100 login-btn"
                [disabled]="loading || loginForm.invalid">

                <i
                    *ngIf="!loading"
                    class="fa-solid fa-right-to-bracket me-2">
                </i>

                <span *ngIf="!loading">

                    Login

                </span>

                <span *ngIf="loading">

                    <span
                        class="spinner-border spinner-border-sm me-2">
                    </span>

                    Please Wait...

                </span>

            </button>

        </form>

    </div>

</div>
